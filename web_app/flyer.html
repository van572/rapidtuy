<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Afiche Promocional RapidTuy - Imagen Oficial</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #0B0F19;
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 15px;
            text-align: center;
        }
        .container {
            max-width: 800px;
            width: 100%;
        }
        .header-title {
            color: #F97316;
            font-size: 1.2rem;
            font-weight: 800;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 16px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.9), 0 0 20px rgba(249,115,22,0.3);
            border: 2px solid #F97316;
            display: block;
            margin: 0 auto;
        }
        .actions {
            margin-top: 20px;
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn {
            background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
            color: #ffffff;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 800;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 8px 20px rgba(37,211,102,0.3);
            transition: transform 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-title">⚡ RAPIDTUY - AFICHE OFICIAL DE COBERTURA</div>
        <img src="./rapidtuy_promo_flyer.jpg" alt="Afiche Promocional RapidTuy Valles del Tuy">
        <div class="actions">
            <a href="https://wa.me/584261215060?text=Hola%20RapidTuy%20vi%20el%20afiche%20promocional" class="btn">
                📞 Contactar Central WhatsApp (0426 1215060)
            </a>
        </div>
    </div>
</body>
</html>
